[package]
name = "universal-player-3"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version = "1.100"

[features]
default = ["wry"]
cef = ["dep:tauri-runtime-cef"]
wry = ["dep:tauri-runtime-wry"]

[lib]
name = "u3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }
tauri-typegen = "0.5.3"

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = [] }
tauri-runtime-wry = { version = "3.0.0-alpha.6", optional = true, features = ["unstable", "devtools"] }
tauri-runtime-cef = { version = "3.0.0-alpha.7", optional = true, features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [profile.release]
# lto = "thin"
# panic = "abort"
# strip = true
